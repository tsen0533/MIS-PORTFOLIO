<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLAIRE WEI — Creative Strategist & Content Producer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --surface: #141418;
      --surface-hover: #1c1c22;
      --border: rgba(255, 255, 255, 0.1);
      --text-primary: #f4f4f6;
      --text-secondary: #9ca3af;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Noto Sans TC', sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: -2;
    }

    .cursor-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: -1;
      transition: opacity 0.3s ease;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 12, 0.75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1.1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 1.5px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 1.8rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .hero {
      max-width: 1180px;
      margin: 0 auto;
      padding: 5.5rem 1.5rem 4rem;
      display: grid;
      grid-template-columns: 1.35fr 0.65fr;
      gap: 3rem;
      align-items: center;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.2rem;
      display: block;
    }

    .hero h1 {
      font-size: 3.1rem;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
    }

    .hero h1 em {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 700;
      color: var(--accent);
    }

    .hero-desc {
      color: var(--text-secondary);
      font-size: 1.08rem;
      max-width: 580px;
      margin-bottom: 2rem;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .profile-frame {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      aspect-ratio: 4 / 5;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    }

    .profile-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transition: transform 0.5s ease;
    }

    .profile-frame:hover img {
      transform: scale(1.04);
    }

    .profile-overlay {
      position: relative;
      z-index: 1;
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(10px);
      padding: 1rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .profile-overlay strong {
      display: block;
      font-size: 1rem;
      color: #fff;
    }

    .profile-overlay span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
    }

    .metrics-strip {
      max-width: 1180px;
      margin: 0 auto 4.5rem;
      padding: 0 1.5rem;
    }

    .metrics-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.8rem;
      gap: 1.5rem;
    }

    .metric-cell h3 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--accent);
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }

    .metric-cell p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .works-section {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1rem 1.5rem 6rem;
    }

    .works-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .works-header h2 {
      font-size: 2rem;
      font-weight: 900;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(245, 158, 11, 0.5);
    }

    .card-thumb {
      height: 200px;
      position: relative;
      overflow: hidden;
      background: #1f1f26;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-thumb img {
      transform: scale(1.06);
    }

    .card-meta-top {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }

    .badge-dark {
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 0.25rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-audio {
      background: rgba(245, 158, 11, 0.9);
      color: #000;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .card-content {
      padding: 1.5rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-kpi-tag {
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }

    .card-content h3 {
      font-size: 1.2rem;
      margin-bottom: 0.6rem;
      line-height: 1.4;
    }

    .card-content p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1.4rem;
    }

    .card-action {
      font-size: 0.85rem;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    /* 彈窗 Modal 共用樣式 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #141418;
      border: 1px solid rgba(255,255,255,0.15);
      max-width: 720px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      position: relative;
      animation: modalPop 0.25s ease-out;
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.96) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-cover {
      height: 240px;
      position: relative;
      background: #1e1e24;
    }

    .modal-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 10;
    }

    .modal-body {
      padding: 2rem;
    }

    .modal-body h2 {
      font-size: 1.65rem;
      margin: 0.5rem 0 1.5rem;
    }

    .modal-kpis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .m-kpi {
      background: #0a0a0c;
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
    }

    .m-kpi strong {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .m-kpi span {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* HTML5 音檔播放器 */
    .audio-player-card {
      background: #0a0a0c;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 1.15rem 1.35rem;
      margin-bottom: 2rem;
      display: none;
    }

    .audio-player-card.visible {
      display: block;
    }

    .audio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
    }

    .audio-title-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .on-air-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .audio-track-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .play-toggle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #000;
      font-size: 0.95rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s ease, background 0.2s;
    }

    .play-toggle-btn:hover {
      transform: scale(1.06);
      background: #fbbf24;
    }

    .progress-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.1s linear;
    }

    .time-readout {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    .m-block {
      margin-bottom: 1.5rem;
    }

    .m-block h4 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .m-block p, .m-block li {
      color: #d1d5db;
      font-size: 0.95rem;
    }

    .m-block ul {
      padding-left: 1.2rem;
    }

    .m-block li {
      margin-bottom: 0.4rem;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 3.5rem 1.5rem;
      text-align: center;
      color: var(--text-secondary);
    }

    .cta-link {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 2rem;
      background: var(--accent);
      color: #000;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      font-size: 0.9
